<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Survival Room</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .chat-container { max-width: 800px; margin: 2rem auto; background: rgba(30, 41, 59, 0.9); border-radius: 15px; padding: 1rem; display: flex; flex-direction: column; height: 85vh; border: 1px solid #38bdf8; }
        .chat-header { text-align: center; padding-bottom: 1rem; border-bottom: 1px solid rgba(255, 255, 255, 0.1); }
        .chat-box { flex-grow: 1; overflow-y: auto; padding: 1rem; display: flex; flex-direction: column; gap: 1rem; }
        .message { padding: 1rem; border-radius: 10px; max-width: 85%; }
        .message.ai { background: rgba(56, 189, 248, 0.15); align-self: flex-start; border: 1px solid rgba(56, 189, 248, 0.3); }
        .message.player { background: rgba(255, 255, 255, 0.1); align-self: flex-end; }
        .message strong { color: #38bdf8; display: block; margin-bottom: 5px; }
        .chat-input { display: flex; gap: 10px; margin-top: 1rem; }
        .chat-input input { flex-grow: 1; padding: 1rem; border-radius: 10px; border: 1px solid rgba(255,255,255,0.2); background: #0f172a; color: white; font-family: 'Poppins', sans-serif; outline: none; }
        .btn-send { background-color: #38bdf8; color: #0f172a; border: none; padding: 0 1.5rem; border-radius: 10px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <h2>🤖 AI Survival</h2>
            <p>Room: <span id="roomDisplay" class="highlight"></span> | Pemain: <span id="nameDisplay"></span></p>
        </div>
        <div class="chat-box" id="chatBox"></div>
        <div class="chat-input">
            <input type="text" id="actionInput" placeholder="Ketik aksimu..." autocomplete="off">
            <button class="btn-send" onclick="kirimAksi()">Kirim</button>
        </div>
    </div>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const roomCode = urlParams.get('room');
        document.getElementById('roomDisplay').innerText = roomCode || "ERROR";
        let playerName = localStorage.getItem('playerName');
        if (!playerName) { playerName = prompt("Masukkan namamu:"); localStorage.setItem('playerName', playerName); }
        document.getElementById('nameDisplay').innerText = playerName;
        const chatBox = document.getElementById('chatBox');
        const actionInput = document.getElementById('actionInput');
        function appendMessage(pengirim, teks, isAi = false) {
            const div = document.createElement('div');
            div.className = `message ${isAi ? 'ai' : 'player'}`;
            div.innerHTML = `<strong>${pengirim}</strong> ${teks}`;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }
        async function startGame() {
            appendMessage("Sistem", "Memanggil Game Master AI...");
            try {
                const response = await fetch('/api/ai-adventure/start', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ roomCode, theme: 'Kiamat Zombie' }) });
                const data = await response.json();
                chatBox.innerHTML = '';
                if (data.success) { appendMessage("Game Master", data.message, true); }
                else { appendMessage("Sistem", "Gagal memulai: " + data.error); }
            } catch (e) { appendMessage("Sistem", "Error jaringan ke server."); }
        }
        async function kirimAksi() {
            const action = actionInput.value.trim();
            if (!action) return;
            appendMessage(playerName, action);
            actionInput.value = '';
            const loadingId = "load-" + Math.random();
            const divLoading = document.createElement('div');
            divLoading.className = 'message ai';
            divLoading.id = loadingId;
            divLoading.innerHTML = `<strong>Game Master</strong> Sedang merangkai cerita...`;
            chatBox.appendChild(divLoading);
            chatBox.scrollTop = chatBox.scrollHeight;
            try {
                const response = await fetch('/api/ai-adventure/action', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ roomCode, playerName, action }) });
                const data = await response.json();
                document.getElementById(loadingId).remove();
                if (data.success) { appendMessage("Game Master", data.message, true); }
            } catch (e) { document.getElementById(loadingId).remove(); appendMessage("Sistem", "Gagal memproses aksi."); }
        }
        actionInput.addEventListener('keypress', function (e) { if (e.key === 'Enter') kirimAksi(); });
        startGame();
    </script>
</body>
</html>
